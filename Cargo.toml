[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
cube-core = { path = "crates/cube-core" }
cube-solver = { path = "crates/cube-solver" }
cube-vision = { path = "crates/cube-vision" }
cube-render = { path = "crates/cube-render" }
cube-store = { path = "crates/cube-store" }

eframe = { version = "0.35.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.35.0"
egui-wgpu = "0.35"
wgpu = "29"
kewb = "0.4.3"
# PINNED to a wasm-clean mpedb snapshot (~/mpedb-rubiks-pin, has the
# js-clock feature): the live ~/mpedb WIP currently calls std::time on
# wasm paths (btree/commit/write instrumentation, shm/ring SystemTime)
# which panics in the browser. Point back to ../mpedb/crates/mpedb when
# upstream is wasm-clean again.
mpedb = { path = "../mpedb-rubiks-pin/crates/mpedb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

# Keep wasm-bindgen pinned EXACTLY: trunk matches its CLI against Cargo.lock,
# and eframe 0.35 resolves to this version.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3.77"
# kewb -> rand -> getrandom 0.3 needs the wasm_js backend on wasm32
getrandom = { version = "0.3", features = ["wasm_js"] }

# Deps optimized even in dev builds (wgpu/naga/kewb are unusable unoptimized);
# our own crates stay at opt-level 0 for fast rebuilds on this 2-core box.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
