<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rubik's Cube</title>
    <link data-trunk rel="rust" href="../crates/cube-app/Cargo.toml" data-bin="cube-app" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="../assets/table.bin" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            /* iOS Safari: the URL bar overlays the layout viewport; dvh
               tracks the VISIBLE viewport so nothing hides behind it. */
            height: 100dvh;
            overflow: hidden;
            background: #12151d;
        }
        #rubiks_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            width: 100dvw;
            height: 100%;
            height: 100dvh;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="rubiks_canvas"></canvas>
</body>
</html>
