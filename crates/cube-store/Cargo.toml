[package]
name = "cube-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mpedb.workspace = true
serde.workspace = true
serde_json.workspace = true

# The pinned mpedb routes the wasm clock through js-sys (js-clock);
# tools/patch_mpedb_clock.sh additionally handles newer mpedb versions
# that declare an embedder host-import instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mpedb = { workspace = true, features = ["js-clock"] }
