[package]
name = "cube-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mpedb.workspace = true
serde.workspace = true
serde_json.workspace = true

# wasm-bindgen glue cannot inject the `mpedb` import module; route the
# engine's clock through js-sys instead (upstream `js-clock` feature).
[target.'cfg(target_arch = "wasm32")'.dependencies]
mpedb = { workspace = true, features = ["js-clock"] }
